aid: betastore-beta-store
name: BetaStore, Beta Store
description: >-
  BetaStore (legal entity SimpleMarket Inc., trading as BetaStore.co) is a B2B retail marketplace
  founded in 2020 by Steve Dakayi-Kamga and Leo-Armel Tchoudjang that serves informal neighborhood
  retailers in West and Central Africa, operating across Nigeria, Senegal and Ivory Coast from
  offices in Lagos and a Wilmington, Delaware registration. The platform lets small shopkeepers
  restock fast-moving consumer goods directly from manufacturers and distributors at wholesale
  prices, ordering through SMS, chat, WhatsApp and a mobile app, with logistics partners delivering
  to the store within 24 hours, and it layers embedded working-capital financing on top of observed
  retailer sales. BetaStore raised a 2.5 million dollar pre-Series A in May 2022 led by 500 Global
  with VestedWorld and Loyal VC. As of the July 2026 enrichment pass BetaStore publishes no public
  API, developer portal, documentation, SDK or machine-readable artifact of any kind, and its
  betastore.co domain serves no content -- both the apex and www hosts answer every path with a
  blanket Cloudflare 301 to unrelated third-party domains, and no api/app/docs subdomain resolves.
